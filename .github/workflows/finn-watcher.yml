name: finn.no watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: finn-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore seen-listings state
        uses: actions/cache/restore@v4
        with:
          path: tools/finn-watcher/.state
          key: finn-state-${{ github.run_id }}
          restore-keys: finn-state-
      - run: node tools/finn-watcher/watch.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEEDBACK_FROM_EMAIL: ${{ secrets.FEEDBACK_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
      - name: Save seen-listings state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/finn-watcher/.state
          key: finn-state-${{ github.run_id }}
