<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>SafeView</title>
</head>
<body>
  <header>
    <h1>SafeView</h1>
    <label class="switch" title="Filtreyi aç/kapat">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>
  <p class="status" id="status">Yükleniyor…</p>
  <label class="field" for="sensitivity">Hassasiyet</label>
  <select id="sensitivity">
    <option value="high">Yüksek (en çok bulanıklaştırır)</option>
    <option value="medium">Orta</option>
    <option value="low">Düşük (sadece açık içerik)</option>
  </select>
  <p class="note">Görüntüler cihazınızda taranır, hiçbir yere gönderilmez. Doğrulanamayan görseller güvenlik için bulanık kalır.</p>
  <script src="popup.js"></script>
</body>
</html>
