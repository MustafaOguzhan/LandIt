<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<title>SafeView</title>
</head>
<body>
  <header>
    <h1>SafeView</h1>
    <label class="switch" title="Filtreyi aç/kapat">
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>
  <p class="status" id="status">Yükleniyor…</p>
  <p class="model" id="model"></p>

  <label class="field" for="sensitivity">Hassasiyet</label>
  <select id="sensitivity">
    <option value="high">Yüksek (kolsuz, şort vb. açıklığı da gizler)</option>
    <option value="medium">Orta (belirgin açıklık)</option>
    <option value="low">Düşük (yalnızca çok açık olanlar)</option>
  </select>

  <label class="field" for="unverified">Kontrol edilemeyen görseller</label>
  <select id="unverified">
    <option value="blur">Bulanık bırak (güvenli)</option>
    <option value="show">Göster</option>
  </select>

  <p class="note">Görüntüler cihazınızda taranır, hiçbir yere gönderilmez.</p>
  <script src="popup.js"></script>
</body>
</html>
